services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-backend
    working_dir: /app/backend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:3001
      MONGODB_CONNECTION_STRING: mongodb://root:root@mongodb:27017/hotel-management?authSource=admin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-me}
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hotel-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-frontend
    working_dir: /app/frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "3001:5174"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hotel-network

  mongodb:
    image: mongo:7
    container_name: hotel-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hotel-network

  mongo-express:
    image: mongo-express:latest
    container_name: hotel-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - hotel-network

volumes:
  mongodb_data:

networks:
  hotel-network:
    driver: bridge