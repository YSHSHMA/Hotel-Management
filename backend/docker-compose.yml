services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-backend-standalone
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:3001
      MONGODB_CONNECTION_STRING: mongodb://root:root@mongodb:27017/hotel-management?authSource=admin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-change-me}
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-network

  mongodb:
    image: mongo:8
    container_name: hotel-mongodb-standalone
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo-express:
    image: mongo-express:latest
    container_name: hotel-mongo-express-standalone
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - backend-network
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  backend-network:
    driver: bridge